# Reverse proxy for the API and admin panel. Replace remote.example.com and
# add TLS (for example: certbot --nginx -d remote.example.com).

limit_req_zone $binary_remote_addr zone=rdlogin:10m rate=10r/m;

server {
    listen 80;
    server_name remote.example.com;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Pass only the address nginx saw. Do not use $proxy_add_x_forwarded_for:
    # it keeps whatever the client sent.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    limit_req_status 429;

    # Optional: restrict the admin panel to known addresses.
    # Put lines such as "allow 203.0.113.10; deny all;" in this file.
    # include /etc/nginx/snippets/rustdesk-admin-allow.conf;

    location = /api/admin/login {
        limit_req zone=rdlogin burst=5 nodelay;
        proxy_pass http://127.0.0.1:21114;
    }

    location = /api/login {
        limit_req zone=rdlogin burst=5 nodelay;
        proxy_pass http://127.0.0.1:21114;
    }

    location / {
        proxy_pass http://127.0.0.1:21114;
    }
}
